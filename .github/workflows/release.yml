name: Build and Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/Detached.OrleansContrib.Streaming.GrainStream/Detached.OrleansContrib.Streaming.GrainStream.csproj

    - name: Build
      run: dotnet build src/Detached.OrleansContrib.Streaming.GrainStream/Detached.OrleansContrib.Streaming.GrainStream.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test tests/Detached.OrleansContrib.Streaming.GrainStream.Tests/Detached.OrleansContrib.Streaming.GrainStream.Tests.csproj --configuration Release --no-build -p:CollectCoverage=true -p:CoverletOutput=TestResults/ -p:CoverletOutputFormat=opencover

    - name: Pack
      run: dotnet pack src/Detached.OrleansContrib.Streaming.GrainStream/Detached.OrleansContrib.Streaming.GrainStream.csproj --configuration Release --no-build --output .

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          tests/Detached.OrleansContrib.Streaming.GrainStream.Tests/TestResults/coverage.opencover.xml
          *.nupkg

    - name: Publish to GitHub Packages
      run: dotnet nuget push "*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }}
